name: "Build and unit tests"
on:
  push:
    tags:
      - "**"
    branches:
      - main
  pull_request:

env:
  JAVA_VERSION: openjdk@1.11
  SCALA_VERSION: "2.13"
  GITHUB_ACTOR: ${{ secrets.ATALA_GITHUB_ACTOR }}
  GITHUB_TOKEN: ${{ secrets.ATALA_GITHUB_TOKEN }}
  COURSIER_JAVA_ARGS: "-Djdk.tls.client.protocols=TLSv1.2"

jobs:
  build-and-test:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Check formatting
        run: sbt scalafmtCheckAll

      - name: Compile and test
        run: sbt coverage test

      - name: Generate code coverage reports
        if: always()
        run: sbt coverageReport coverageAggregate

      - name: Publish Backend Unit Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v1
        with:
          files: "target/test-reports/**/TEST-*.xml"
          check_run_annotations_branch: "*"

  e2e-tests:
    name: "E2E tests"
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      JAVA_VERSION: openjdk@1.11
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Run E2E suite (docker compose)
        run: ./docker/prism-test/run-e2e.sh

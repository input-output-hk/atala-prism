---
# yamllint disable rule:truthy
name: "Build and Test"

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: openjdk@1.11
  SCALA_VERSION: "2.13"
  GITHUB_ACTOR: ${{ secrets.ATALA_GITHUB_ACTOR }}
  GITHUB_TOKEN: ${{ secrets.ATALA_GITHUB_TOKEN }}
  COURSIER_JAVA_ARGS: "-Djdk.tls.client.protocols=TLSv1.2"
  JAVA_TOOL_OPTIONS: "-Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2"
  SBT_OPTS: "-Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2"

jobs:
  format-and-unit:
    name: "Format & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache sbt/coursier
        uses: coursier/cache-action@v6.3

      - name: Check formatting
        run: sbt -Dsbt.supershell=false scalafmtCheckAll

      - name: Compile and test with coverage
        run: sbt -Dsbt.supershell=false coverage test

      - name: Generate code coverage reports
        if: always()
        run: sbt -Dsbt.supershell=false coverageReport coverageAggregate

      - name: Publish Backend Unit Test Results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v1
        with:
          files: "target/test-reports/**/TEST-*.xml"
          check_run_annotations_branch: "*"

  e2e-tests:
    name: "E2E Tests"
    runs-on: ubuntu-latest
    needs: format-and-unit
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache sbt/coursier
        uses: coursier/cache-action@v6.3

      - name: Build prism-node image locally (publishLocal)
        run: sbt -Dsbt.supershell=false "Docker / publishLocal"

      - name: Run E2E suite (docker compose)
        run: ./docker/prism-test/run-e2e.sh

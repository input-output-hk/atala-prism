name: "Publish prism-node to Docker Hub"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  JAVA_VERSION: openjdk@1.11
  COURSIER_JAVA_ARGS: "-Djdk.tls.client.protocols=TLSv1.2"
  JAVA_TOOL_OPTIONS: "-Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2"
  SBT_OPTS: "-Djdk.tls.client.protocols=TLSv1.2 -Dhttps.protocols=TLSv1.2"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: ${{ env.JAVA_VERSION }}

      - name: Compute revision tag
        id: revision
        run: |
          VERSION=$(grep -Eo '[0-9]+\.[0-9]+\.[0-9]+(-SNAPSHOT)?' version.sbt | head -1)
          REVISION_TAG=${VERSION}-${GITHUB_SHA::7}
          echo "revision_tag=${REVISION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Cache sbt/coursier
        uses: coursier/cache-action@v6.3

      - name: Stage Docker image with sbt
        run: sbt -Dsbt.supershell=false -J-Xmx4G "Docker / stage"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/inputoutput/prism-node
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=edge,branch=main
            type=edge,branch=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Login to Docker Hub
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx (multi-arch)
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./target/docker/stage
          file: ./target/docker/stage/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.tags }}
            docker.io/inputoutput/prism-node:${{ steps.revision.outputs.revision_tag }}
          labels: ${{ steps.meta.outputs.labels }}
